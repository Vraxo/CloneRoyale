name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test:unit:coverage
      - run: npm run test:multiplayer
      - run: npm run test:server-services
      - run: npm run test:accounts
      - run: npm run test:auth-api
      - run: npm run test:replay
      - run: npm run test:replay-archive
      - run: npm run test:offline
